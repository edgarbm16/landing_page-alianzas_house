name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta todos los lunes a las 00:00 UTC (1 vez por semana es suficiente)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/landings?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
